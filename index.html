<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather123 — Simple Weather + Radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="clocks" class="clocks" aria-label="World clocks"><!-- filled by JS --></div>
  <header class="topbar">
    <h1>weather123</h1>
    <div class="location">
      <span class="loc-label">Radar + conditions for</span>
      <span id="loc-name">Detecting location&hellip;</span>
    </div>
  </header>

  <main>
    <section id="radar-section" class="card">
      <div class="card-head">
        <h2>Live Radar</h2>
        <span id="radar-time" class="muted"></span>
        <span id="radar-status" class="muted"></span>
      </div>
      <div id="map"></div>
    </section>

    <section id="conditions" class="card">
      <div class="card-head">
        <h2>Current Conditions</h2>
        <span id="cond-loc" class="muted"></span>
      </div>
      <div id="cond-grid">
        <div class="cond-main">
          <div id="cond-desc" class="cond-desc">&mdash;</div>
          <div id="cond-temp" class="cond-temp">&mdash;&deg;</div>
          <div id="cond-feel" class="muted">feels like &mdash;&deg;</div>
        </div>
        <dl id="cond-stats">
          <div><dt>Humidity</dt><dd id="cond-humidity">&mdash;</dd></div>
          <div><dt>Wind</dt><dd id="cond-wind">&mdash;</dd></div>
          <div><dt>Precipitation</dt><dd id="cond-precip">&mdash;</dd></div>
          <div><dt>Updated</dt><dd id="cond-updated">&mdash;</dd></div>
        </dl>
      </div>
    </section>

    <section id="forecast" class="card">
      <div class="card-head">
        <h2>5-Day Forecast</h2>
      </div>
      <div id="forecast-grid" class="forecast-grid"><!-- filled by JS --></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Radar Source Layers</h2></div>
      <div class="layer-toggle">
        <label><input type="checkbox" id="layer-radar" checked> Rain (RainViewer)</label>
        <label><input type="checkbox" id="layer-precip"> Precipitation (Open-Meteo tiles)</label>
        <label><input type="checkbox" id="layer-temp"> Temperature (Open-Meteo tiles)</label>
      </div>
    </section>
  </main>

  <footer>
    <p class="muted">
      Data: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> radar,
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> weather / tiles,
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> map.
    </p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
